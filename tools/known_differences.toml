# Differences from the pre-refactor baseline that are understood and accepted.
#
# Everything else that differs is a bug. Entries here are NOT silenced: verify.py
# still prints them, it just does not fail on them. Each needs a reason a reader
# can check.

["hd_clustering_panels.pdf"]
figure  = "Figure3"
pixels  = 193
reason  = """Two things: one character in a label, and antialiasing.

FIRST, a single character: "p = 0.01" became "p < 0.01".

The permutation p-value sits on its own resolution floor -- with N draws the
smallest attainable value is 1/(N+1) -- so the label flips between "=" and "<"
on an arbitrarily small change in the null. The null used to move between runs,
because the vendored Posani dimensionality reduction called PCA() with no
random_state and sklearn chose the randomized solver (see
Code/shapemetrics/vendor/README.md). Now that it is pinned to svd_solver="full"
the value is deterministic, and it lands just below the floor rather than on it.

The statistic is unchanged. What changed is that it stopped moving.

SECOND, ~122 pixels at a maximum delta of 2/255, scattered over panel a's
scatter and the axis text. That is the same environment-level antialiasing
difference as summary.pdf below; see there.

Panel a used to be worse. `PCA(10).fit(Xs)` was a THIRD unseeded-randomized-PCA
site: at 2691 x 360 with 10 components sklearn picks the randomized solver, so
PC1-PC2 moved by up to 8e-4 between runs and the ring redrew differently every
time -- 2,497 pixels between two runs of identical code, which is twenty times
this whole entry. It is now pinned to svd_solver="full" and two runs agree
exactly. The count above is therefore stable, where before it was a sample."""

["region_categoricality.npz"]
figure    = "Figure2"
array     = "z"
tolerance = 1e-2
reason    = """The baseline is one draw from a statistic that used to be random.

The golden file was computed before the vendored PCA solver was pinned, when
repeating the identical computation in a second process gave different answers:

    region 0    5.2057314727   vs   5.2050811612
    region 1   -0.1459566106   vs   -0.1427143441

so there is no value the new code could reproduce exactly. The new one is stable
to 1e-12 across processes; the residual gap to the baseline is that old noise.

Region 1's z sits near zero, where z = (obs - mean)/std is ill-conditioned and a
small change in the null moves it disproportionately -- which is why the
tolerance is loose. Re-baseline once Figure 2 has been re-run and inspected."""


["summary.pdf"]
figure  = "Figure2"
pixels  = 25
reason  = """Antialiasing, at a maximum delta of 13/255, in text and marker edges.

Not a data difference, and not caused by moving Figure 2 onto the tracked
14 MB rrr_selective.npz. That was checked directly: the notebook was run once
against the 178 MB rrr_neurons.npz and once against the slim file, and the two
PDFs are pixel-identical to each other (0 px). Both differ from the baseline by
these same 25 px. tools/verify_posani_slim.py makes the stronger claim on the
numbers -- 27 checks, exact array equality, regions through features.

Two runs in this environment also agree exactly (0 px), so the figure is
deterministic; the gap is between this environment and the one the baseline was
rendered in. Re-baseline whenever Figure 2 is next re-run and inspected."""
