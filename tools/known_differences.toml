Not pinned, unlike those three. It is an exploratory notebook over the raw .mat
tier that feeds no compiled figure, and seeding it would change the figure it
draws -- a decision for whoever owns the analysis, not a refactor's to make.
Recorded so the difference is not mistaken for a regression."""

