# Separate environment for the Allen Brain Observatory download step ONLY.
#
#   conda env create -f environment-allen.yml
#   conda activate shapemetrics-allen
#   python allen-brain/extract_data.py
#
# Why this is separate: allensdk pins numpy<1.24 and pandas==1.5.3. Installing
# it into the main env downgrades numpy from 2.x to 1.23.5 and breaks ibllib
# and scikit-learn. Once extract_data.py has written its .npz files, switch
# back to `shapemetrics` for allen-brain/make_fig.py, which needs only
# numpy/sklearn/netrep/matplotlib.
name: shapemetrics-allen
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy<1.24
  - pandas=1.5.3
  - scipy<1.11
  - h5py
  - tqdm
  - pip
  - pip:
      - allensdk
