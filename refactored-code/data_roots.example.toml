# Copy to data_roots.toml (gitignored) and point at wherever the raw data lives.
#
# Only needed by scripts in extract/. A figure notebook reads Data/derived/,
# which is tracked, so a fresh clone reproduces every figure without this file.
#
# Resolution order: $SHAPEMETRICS_DATA, then this file, then Data/external.

# Used for any dataset without its own entry below.
default = "~/shapemetrics-data"

[roots]
# The 67 GB currently sits inside the repo. Prefer moving it OUT of Dropbox:
# smart-sync can materialise or break symlinks under a synced folder.
iblreproducibility = "../ibl_analyses/data"
duszkiewicz2024    = "../duszkiewicz_analyses"
posani2026         = "../Posani"
siegel2015         = "../siegel_analyses/data"
noel2025           = "../new_IBL_analyses/data_asd"
