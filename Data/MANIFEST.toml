# What each large file in Data/derived/ is, and where it came from.
#
# Everything listed here is TRACKED: a clone gets it, and every notebook in the
# repository runs without downloading anything. That was not true before -- the
# four files at the bottom used to live outside git, and the notebooks that
# needed them could not run from a clone at all.
#
# Nothing here is raw data. Each is a derived product small enough to track,
# produced by the `extract/` script named against it from a raw tier that stays
# out of git (67 GB, one file 29.8 GB). Re-running an extract script is an
# occasional, documented step; reproducing a figure never needs one.
#
# Verify a copy:  shasum -a 256 <file>

